:root{--paper:#fdfdfd;--ink:#000;--g1:#6a6a6a;--g2:#828282;--g3:#bdbdbd}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--paper)}
body{position:relative;color:var(--ink);font-family:"CdText",sans-serif;font-weight:500;letter-spacing:0;
  -webkit-font-smoothing:antialiased;cursor:default;-webkit-user-select:none;user-select:none}
body.idle{cursor:none}
canvas{position:absolute;left:0;top:0;display:block;pointer-events:none}
#num,#fx{transition:opacity .6s ease}
body.set #num,body.set #fx,body.paused #num,body.paused #fx{opacity:.26}
body.set #num,body.set #fx{transition:none}
#fx{mix-blend-mode:multiply;visibility:hidden}
.top{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:baseline;
  padding:clamp(12px,2.1vh,30px) clamp(12px,1.04vw,24px) 0;font-size:clamp(12px,.95vw,22px);line-height:1.2;font-weight:400;color:var(--g2)}
.mark{color:var(--g1);font-weight:500}
.keys{display:flex;gap:1.15em;transition:opacity .5s ease}
body.idle .keys{opacity:0}
.line{position:absolute;left:0;top:0;line-height:1.3;white-space:nowrap;display:flex;align-items:baseline}
.bl{display:block;width:0;height:0}
.g{color:var(--g2);font-weight:400}
input{font:inherit;color:inherit;background:transparent;border:0;border-bottom:.06em solid currentColor;border-radius:0;outline:none;
  width:3.4em;text-align:center;padding:0;caret-color:currentColor;-webkit-user-select:text;user-select:text}
input::placeholder{color:var(--g3);opacity:1}
.k{display:none}
body.set .k.set,body.run .k.run,body.paused .k.pause{display:flex;align-items:baseline;gap:.4em}
#dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
#inv{position:absolute;inset:0;background:#000;color:#f4f4f4;visibility:hidden;pointer-events:none}
#inv .top{color:#8a8a8a}
#inv .mark{color:#a8a8a8}

body.data-error{cursor:default;justify-content:center;align-items:center;display:flex;overflow:auto;-webkit-user-select:text;user-select:text}
.data-error .err{color:#000;max-width:72vw;font-family:"CdText",sans-serif}
.data-error .err-tag{letter-spacing:.04em;opacity:.5;margin-bottom:18px;font:500 14px "CdText",sans-serif}
.data-error h2{margin:0 0 18px;font-size:44px;font-weight:800;line-height:1.15}
.data-error p{word-break:keep-all;margin:0;font-size:18px;font-weight:500;line-height:1.5}
</style>
</head>

<script type="application/json" id="presentation-data">
{
  "version": 1,
  "topic": "강의 쉬는 시간 타이머",
  "title": "쉬는 시간",
  "inputLabel": "쉴 시간",
  "defaultMinutes": 15,
  "backLine": "에 다시 시작합니다",
  "doneLine": "다시 시작합니다",
  "pauseLine": "잠시 멈춤"
}
</script>
<script>
(()=>{
const $=id=>document.getElementById(id), body=document.body, inp=$("in");

// 편집 가능한 자료는 이 JSON 한 곳뿐이다. 문자열은 HTML로 해석하지 않는다.
const MAX_CHARS={topic:40,title:10,inputLabel:8,backLine:14,doneLine:14,pauseLine:8};
const DATA=(()=>{
  const errors=[], node=$("presentation-data");
  let data;
  try{data=JSON.parse(node.textContent)}catch(e){errors.push("presentation-data는 올바른 JSON이어야 합니다.")}
  if(!errors.length){
    if(!data||typeof data!=="object"||Array.isArray(data)) errors.push("presentation-data는 객체여야 합니다.");
    else{
      if(data.version!==1) errors.push("version은 숫자 1이어야 합니다.");
      for(const [key,max] of Object.entries(MAX_CHARS)){
        const value=data[key];
        if(typeof value!=="string") errors.push(key+"은 문자열이어야 합니다.");
        else{const n=[...value].length;if(n>max) errors.push(key+"은 "+max+"자 이하여야 합니다(지금 "+n+"자).");}
      }
      if(typeof data.defaultMinutes!=="number"||!Number.isFinite(data.defaultMinutes)||data.defaultMinutes<1||data.defaultMinutes>600)
        errors.push("defaultMinutes는 1~600 사이의 숫자여야 합니다.");
      const allowed=new Set(["version","defaultMinutes",...Object.keys(MAX_CHARS)]);
      for(const key of Object.keys(data)) if(!allowed.has(key)) errors.push(key+"은 사용할 수 없는 항목입니다.");
    }
  }
  if(!errors.length) return data;
  body.className="data-error";
  document.title="자료 설정을 확인해 주세요";
  const panel=document.createElement("div");panel.className="err";panel.setAttribute("role","alert");
  const tag=document.createElement("div");tag.className="err-tag";tag.textContent="PRESENTATION DATA";panel.append(tag);
  const title=document.createElement("h2");title.textContent="자료 설정을 확인해 주세요";panel.append(title);
  for(const message of errors){const p=document.createElement("p");p.textContent=message;panel.append(p)}
  body.replaceChildren(panel);
  return null;
})();
if(!DATA) return;
document.title=DATA.title;
document.querySelectorAll(".mark").forEach(el=>el.textContent=DATA.title);
$("input-label").textContent=DATA.inputLabel;
inp.placeholder=String(DATA.defaultMinutes);
$("pause-line").textContent=DATA.pauseLine;
$("done-line").textContent=DATA.doneLine;

let mode="set", endAt=0, total=0, left=0, chimed60=false, ac=null, lock=null, idleT=0;

// ── 숫자판 ── 인스타 저장 63번(aristidebenoist WebGPU)의 짜임·움직임을 옮긴다.
// 큰 두 자리 + 윗첨자(원본 「S¹⁵」), 바뀐 칸만 조각나며 방사 번짐·색번짐(바깥 주황/안쪽 파랑)으로 0.9초에 넘어간다.
const R=(()=>{
  const num=$("num"), fx=$("fx"), invc=$("invnum"), line=$("line"), invl=$("invline"), dim=$("dim"), inv=$("inv");
  // Geist 고정폭 숫자. 큰 숫자 wght 440 · 윗첨자 wght 590(원본도 작은 숫자가 더 굵다, 획/높이 0.107 대 0.141~0.153).
  // 자간은 원본 숫자 중심 간격에 맞춤: 큰 「83」 0.572em → −0.033 · 작은 「32」 0.605em → −0.018 (조이는 취향 아님, 실측)
  const E={adv:.605,col:.299,tr:-.033,cap:.710,lsb:.039,top:.726,bot:.016,fam:"CdNumB"};
  const Es={adv:.623,tr:-.018,lsb:.036,ink:.586,fam:"CdNumS"};
  const SUP=.572, RISE=.096;                                             // 원본 「S¹⁵」 실측: 윗첨자 높이 143/250 · 머리가 24/250 위
  // 시간은 원본 프레임에서 잰 값(30fps): 숫자 바뀜 0.8초·번짐 정점 0.3초(63-1 f005→f028)
  // 끝 화면: 옛 화면이 먼저 어두워지고(0.5초) 0.17초 뒤 검은 판이 0.6초에 차오름 · 돌아올 땐 흰 판 0.7초(63-6 f007→f031·f103→f124, 곡선 맞춤 오차 1% 안)
  const MORPH_MS=800, DIM_MS=500, LEAD_MS=170, DONE_MS=600, BACK_MS=700;
  const EASE_UP="cubic-bezier(.65,.2,.25,.8)", EASE_BACK="cubic-bezier(.65,.1,.25,.9)", EASE_DIM="cubic-bezier(.5,1,.89,1)";
  const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const cA=document.createElement("canvas"), cB=document.createElement("canvas");
  let dpr=1, G=null, cur=null, mo=null, gl=null, U={}, tA=null, tB=null, aInv=null, aDim=null, inked=false;
  const split=txt=>{const a=txt.split(":"), sup=[...a.pop()], big=[...a.join(":")];
    return {key:big.map(c=>c===":"?":":"0").join(""), chars:big.concat(sup), nb:big.length}};

  function geom(sp){
    const vw=innerWidth, vh=innerHeight, big=sp.chars.slice(0,sp.nb);
    let bigEm=0; for(const c of big) bigEm+=(c===":"?E.col:E.adv)+E.tr;
    const inkEm=bigEm+(Es.adv+Es.tr+Es.ink)*SUP-E.lsb;
    const S=Math.min(.58*vh/E.cap,.82*vw/inkEm), h=E.cap*S, s2=SUP*S;
    const yb=Math.round(vh/2-.012*vh+h*(1+RISE)/2), yb2=yb-h*(1+RISE)+E.cap*s2;
    const x0=(vw-inkEm*S)/2-E.lsb*S, pos=[]; let x=x0;
    for(const c of big){const a=c===":"?E.col:E.adv; pos.push({x,yb,size:S,adv:a,fam:E.fam}); x+=(a+E.tr)*S}
    const xs=x;
    for(let i=0;i<2;i++){pos.push({x,yb:yb2,size:s2,adv:Es.adv,fam:Es.fam}); x+=(Es.adv+Es.tr)*s2}
    const pad=Math.ceil(.05*S), bx=Math.floor(x0-pad), by=Math.floor(yb2-E.top*s2-pad);
    return {key:sp.key, S, h, yb, pos, fs:Math.max(15,Math.min(40,.05*h)), capX:xs+Es.lsb*s2,
      box:{x:bx, y:by, w:Math.ceil(x+.2*s2+pad)-bx, h:Math.ceil(yb+E.bot*S+pad)-by}};
  }
  const cells=sp=>sp.chars.map((ch,i)=>{const p=G.pos[i], w=(ch===":"?E.col:p.adv)*p.size;
    return {ch, x:p.x, yb:p.yb, size:p.size, fam:p.fam, x0:p.x, x1:p.x+w, y0:p.yb-E.top*p.size, y1:p.yb+E.bot*p.size}});
  function paint(cv,box,list,color,d){
    const W=Math.max(1,Math.round(box.w*d)), H=Math.max(1,Math.round(box.h*d));
    if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H}
    const c=cv.getContext("2d");
    c.setTransform(1,0,0,1,0,0); c.clearRect(0,0,W,H);
    c.setTransform(d,0,0,d,0,0); c.fillStyle=color; c.textBaseline="alphabetic"; c.textAlign="left";
    for(const g of list){c.font='400 '+g.size+'px "'+g.fam+'"'; c.fillText(g.ch,g.x-box.x,g.yb-box.y)}
  }
  function put(cv,box){const s=cv.style; s.left=box.x+"px"; s.top=box.y+"px"; s.width=box.w+"px"; s.height=box.h+"px"}
  // 안내 줄은 원본에서 밑줄이 있던 자리, 윗첨자 아래, 큰 숫자와 같은 기준선
  function fit(l){
    if(!G) return; const s=l.style; s.left=G.capX+"px"; s.fontSize=G.fs+"px"; s.top="0px";
    s.top=(G.yb-(l.firstElementChild.getBoundingClientRect().top-l.getBoundingClientRect().top))+"px";
  }
  function place(){dpr=Math.min(2,window.devicePixelRatio||1); put(num,G.box); put(invc,G.box); fit(line); fit(invl)}

  function show(txt,anim){
    const sp=split(txt);
    if(!G||G.key!==sp.key){end(); G=geom(sp); place(); cur=null}
    if(cur&&txt===cur.txt&&(anim||!mo)) return;
    const now=cells(sp);
    if(!cur||!anim||!gl||still||document.hidden){end(); paint(num,G.box,now,"#000",dpr); cur={txt,cells:now}; return}
    const ch=[]; now.forEach((c,i)=>{if(c.ch!==cur.cells[i].ch) ch.push(i)});
    begin(cur.cells,now,ch); cur={txt,cells:now};
  }
  function begin(old,now,ch){
    end();
    paint(num,G.box,now.filter((c,i)=>ch.indexOf(i)<0),"#000",dpr);
    let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    for(const i of ch) for(const c of [old[i],now[i]]){x0=Math.min(x0,c.x0);y0=Math.min(y0,c.y0);x1=Math.max(x1,c.x1);y1=Math.max(y1,c.y1)}
    const cx=(x0+x1)/2, cy=(y0+y1)/2, L=(y1-y0)/2, m=.36*Math.hypot(x1-x0,y1-y0)/2+.14*L+12;
    const box={x:Math.floor(x0-m), y:Math.floor(y0-m)}; box.w=Math.ceil(x1+m)-box.x; box.h=Math.ceil(y1+m)-box.y;
    const d=box.w*box.h*dpr*dpr>2.2e6?1:dpr;   // 분이 바뀌는 큰 전환은 1배 해상도로(약한 그래픽에서도 매끈하게)
    paint(cA,box,ch.map(i=>old[i]),"#000",d); paint(cB,box,ch.map(i=>now[i]),"#000",d);
    put(fx,box);
    if(fx.width!==cA.width||fx.height!==cA.height){fx.width=cA.width; fx.height=cA.height}
    gl.viewport(0,0,fx.width,fx.height); up(tA,cA,0); up(tB,cB,1);
    gl.uniform2f(U.res,fx.width,fx.height); gl.uniform2f(U.ctr,(cx-box.x)*d,(box.y+box.h-cy)*d);
    gl.uniform1f(U.L,L*d); gl.uniform1f(U.seed,Math.random()*61.7);
    mo={t0:performance.now(),cells:now,raf:0};
    frame(); fx.style.visibility="visible";
  }
  function frame(){
    if(!mo) return;
    const t=Math.min(1,(performance.now()-mo.t0)/MORPH_MS);
    gl.uniform1f(U.p,t); gl.drawArrays(gl.TRIANGLE_STRIP,0,4);   // 진행은 직선, 번짐 정점이 0.45초(원본 실측 37~52%)
    if(t>=1){end(); return}
    mo.raf=requestAnimationFrame(frame);
  }
  function end(){
    if(!mo) return;
    cancelAnimationFrame(mo.raf); const c=mo.cells; mo=null;
    paint(num,G.box,c,"#000",dpr); fx.style.visibility="hidden";
  }
  function up(t,cv,u){gl.activeTexture(gl.TEXTURE0+u); gl.bindTexture(gl.TEXTURE_2D,t); gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,cv)}
  function initGL(){
    try{
      const g=fx.getContext("webgl",{alpha:false,antialias:false,depth:false,stencil:false,preserveDrawingBuffer:false});
      if(!g) return null;
      const FS=`#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform sampler2D tA,tB; uniform vec2 res,ctr; uniform float L,p,seed;
float h1(vec2 v){return fract(sin(dot(v+seed,vec2(127.1,311.7)))*43758.5453);}
vec2 h2(vec2 v){return vec2(h1(v),h1(v+vec2(19.19,7.13)));}
vec2 rot(vec2 v,float a){float c=cos(a),s=sin(a);return vec2(c*v.x-s*v.y,s*v.x+c*v.y);}
float eo(float x){x=clamp(x,0.,1.);return 1.-pow(1.-x,3.);}
void main(){
  vec2 P=gl_FragCoord.xy, q=(P-ctr)/L; float t=clamp(p,0.,1.);
  vec2 g=q*1.2, n=floor(g), f=fract(g); float md=9.; vec2 id=vec2(0.);
  for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){vec2 o=vec2(float(i),float(j)); vec2 r=o+h2(n+o)-f; float dd=dot(r,r); if(dd<md){md=dd; id=n+o;}}
  float r1=h1(id), r2=h1(id+3.7), r3=h1(id+9.1), r4=h1(id+5.3);
  float sw=.02+.22*r1, useB=step(sw,t);
  float k=useB<.5?smoothstep(sw-.12,sw,t):1.-eo((t-sw)/.32);
  float bump=pow(max(sin(3.14159265*pow(t,.7067)),0.),1.25);   // 정점 t=.375(0.3초), 원본 무른 가장자리 곡선 맞춤
  bump*=1.+.35*exp(-pow((t-.45)/.15,2.));                       // 원본은 0.23~0.47초에 번짐이 넓게 머문다(고원)
  vec2 d=rot(q-(vec2(r3,r4)-.5)*.20*k,-(r2-.5)*.30*k)/(1.+.08*bump);
  float amt=.11*bump+.03*k*r2, ch=.0255*bump+.007*k, jit=h1(P*.731+.17)-.5;
  vec2 a=ctr/res, b=d*L/res; vec3 ink=vec3(0.);
  for(int m=0;m<16;m++){
    float s=1.+amt*((float(m)+.5+jit)/16.-.5);
    vec2 uR=a+b*(s+ch), uG=a+b*s, uB=a+b*(s-ch);
    if(useB>.5) ink+=vec3(texture2D(tB,uR).a,texture2D(tB,uG).a,texture2D(tB,uB).a);
    else ink+=vec3(texture2D(tA,uR).a,texture2D(tA,uG).a,texture2D(tA,uB).a);
  }
  ink=clamp(ink/16.*(1.+.25*clamp(amt*12.,0.,1.)),0.,1.);
  gl_FragColor=vec4(1.-ink,1.);
}`;
      const sh=(ty,src)=>{const o=g.createShader(ty); g.shaderSource(o,src); g.compileShader(o); if(!g.getShaderParameter(o,g.COMPILE_STATUS)) throw g.getShaderInfoLog(o); return o};
      const pr=g.createProgram();
      g.attachShader(pr,sh(g.VERTEX_SHADER,"attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}"));
      g.attachShader(pr,sh(g.FRAGMENT_SHADER,FS)); g.linkProgram(pr);
      if(!g.getProgramParameter(pr,g.LINK_STATUS)) throw g.getProgramInfoLog(pr);
      g.useProgram(pr);
      g.bindBuffer(g.ARRAY_BUFFER,g.createBuffer()); g.bufferData(g.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),g.STATIC_DRAW);
      const loc=g.getAttribLocation(pr,"a"); g.enableVertexAttribArray(loc); g.vertexAttribPointer(loc,2,g.FLOAT,false,0,0);
      for(const n of ["res","ctr","L","p","seed"]) U[n]=g.getUniformLocation(pr,n);
      g.uniform1i(g.getUniformLocation(pr,"tA"),0); g.uniform1i(g.getUniformLocation(pr,"tB"),1);
      g.pixelStorei(g.UNPACK_FLIP_Y_WEBGL,true);
      const mk=u=>{const t=g.createTexture(); g.activeTexture(g.TEXTURE0+u); g.bindTexture(g.TEXTURE_2D,t);
        for(const [k,v] of [[g.TEXTURE_MIN_FILTER,g.LINEAR],[g.TEXTURE_MAG_FILTER,g.LINEAR],[g.TEXTURE_WRAP_S,g.CLAMP_TO_EDGE],[g.TEXTURE_WRAP_T,g.CLAMP_TO_EDGE]]) g.texParameteri(g.TEXTURE_2D,k,v);
        return t};
      tA=mk(0); tB=mk(1);
      fx.addEventListener("webglcontextlost",e=>{e.preventDefault(); gl=null; end()});
      return g;
    }catch(e){return null}
  }
  gl=initGL();

  // 끝: 원본 63-6 의 쪽 넘김, 검은 쪽이 아래에서 차오르고 앞쪽은 어두워진다 / 처음으로: 흰 쪽이 아래에서 차오른다
  function ink(){if(G) paint(invc,G.box,cells(split("00:00")),"#f4f4f4",dpr)}
  function mode(m){
    fit(line);
    if(m==="done"){
      inked=true; ink();
      if(aInv) aInv.cancel(); if(aDim) aDim.cancel();
      inv.style.visibility="visible";
      aInv=inv.animate([{clipPath:"inset(100% 0 0 0)"},{clipPath:"inset(0% 0 0 0)"}],
        {duration:still?1:DONE_MS,delay:still?0:LEAD_MS,easing:EASE_UP,fill:"both"});
      aDim=dim.animate([{opacity:0},{opacity:.6}],{duration:still?1:DIM_MS,easing:EASE_DIM,fill:"forwards"});
      aInv.onfinish=()=>{if(aDim){aDim.cancel(); aDim=null}};
    }else if(inked){
      inked=false; if(aDim){aDim.cancel(); aDim=null}
      if(aInv) aInv.cancel();
      const a=aInv=inv.animate([{clipPath:"inset(0 0 0% 0)"},{clipPath:"inset(0 0 100% 0)"}],{duration:still?1:BACK_MS,easing:EASE_BACK,fill:"forwards"});
      a.onfinish=()=>{if(aInv===a){inv.style.visibility="hidden"; a.cancel(); aInv=null}};
    }
  }
  function refresh(){if(cur){const t=cur.txt; G=null; cur=null; show(t,false)} if(inked) ink()}
  Promise.all([document.fonts.load('400 100px "CdNumB"'),document.fonts.load('400 100px "CdNumS"'),document.fonts.ready]).then(refresh,refresh);
  addEventListener("resize",refresh);
  return {show,mode};
})();

function setMode(m){mode=m;body.className=m;if(m==="set"){inp.value="";preview();setTimeout(()=>inp.focus(),0)}R.mode(m)}
function korTime(d){let h=d.getHours(),m=d.getMinutes(),ap=h<12?"오전":"오후";h=h%12||12;return ap+" "+h+"시"+(m?" "+m+"분":"")}

// 입력 해석: 10 · 10분 · 7.5 → 분 / 11:05 · 11시5분 · 1105 → 그 시각까지(지났으면 12시간 뒤)
function parse(raw){
  let s=(raw||"").trim().replace(/\s+/g,"");
  if(!s) s=String(DATA.defaultMinutes)+"분";
  let m;
  if((m=s.match(/^(\d{1,2})(?::|시)(\d{1,2})?분?$/)) || ((m=s.match(/^(\d{3,4})$/)) && +s>180 && +s%100<60 && (m=[s,String(Math.floor(+s/100)),String(+s%100)]))){
    const h=+m[1], mi=+(m[2]||0); if(h>23||mi>59) return null;
    const now=new Date(), t=new Date(now); t.setHours(h,mi,0,0);
    while(t<=now) t.setTime(t.getTime()+12*3600e3);
    if(t-now>12*3600e3) return null;
    return {ms:t-now, at:t};
  }
  if((m=s.match(/^(\d{1,3}(?:\.\d+)?)분?$/))){const v=parseFloat(m[1]); if(!(v>0)||v>600) return null; const ms=Math.round(v*60)*1e3; return {ms, at:new Date(Date.now()+ms)}}
  return null;
}

function draw(ms){
  const t=Math.max(0,Math.ceil(ms/1000)), h=Math.floor(t/3600), m=Math.floor(t%3600/60), s=t%60;
  const p=n=>String(n).padStart(2,"0");
  const txt=h?h+":"+p(m)+":"+p(s):p(m)+":"+p(s);
  R.show(txt,mode==="run");
}
function preview(){
  const r=parse(inp.value);
  draw(r?r.ms:0);
  const clockForm=/[:시]/.test(inp.value)||(/^\d{3,4}$/.test(inp.value.trim())&&+inp.value>180);
  $("hint").textContent=!inp.value.trim()?"분 · Enter":!r?"10 또는 11:05":clockForm?("까지 · "+Math.ceil(r.ms/60e3)+"분"):("분 · "+korTime(r.at)+"까지");
}

// 소리: 바깥 파일 없이 합성, 1분 남았을 때 한 번, 끝날 때 세 음
function audio(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume()}catch(e){}}
function tone(f,at,dur,vol){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type="sine";o.frequency.value=f;
  const t=ac.currentTime+at;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur+.05)}
function chime60(){tone(1046.5,0,1.4,.16)}
function chimeEnd(){tone(784,0,1.8,.2);tone(987.8,.22,1.8,.18);tone(1318.5,.44,2.6,.18)}

async function wake(on){try{if(on&&"wakeLock"in navigator&&!lock){lock=await navigator.wakeLock.request("screen");lock.addEventListener("release",()=>lock=null)}else if(!on&&lock){await lock.release();lock=null}}catch(e){}}

function start(){
  const r=parse(inp.value); if(!r){inp.select();return}
  audio(); total=r.ms; endAt=Date.now()+r.ms; chimed60=r.ms<=60e3;
  $("back").textContent=korTime(r.at)+DATA.backLine;
  inp.blur(); setMode("run"); wake(true); tick();
}
function tick(){
  if(mode==="run"){
    left=endAt-Date.now();
    if(!chimed60&&left<=60e3){chimed60=true;chime60()}
    if(left<=0){left=0;draw(0);setMode("done");chimeEnd();wake(false)}
    else{draw(left)}
  }
}
setInterval(tick,100);

function nudge(min){
  if(mode==="run"){endAt+=min*60e3;total=Math.max(1e3,total+min*60e3);if(endAt-Date.now()>60e3)chimed60=false;$("back").textContent=korTime(new Date(endAt))+DATA.backLine;tick()}
  else if(mode==="paused"){left=Math.max(1e3,left+min*60e3);total=Math.max(left,total+min*60e3);draw(left);if(left>60e3)chimed60=false}
}
function fs(){const d=document;if(!d.fullscreenElement&&!d.webkitFullscreenElement){(d.documentElement.requestFullscreen||d.documentElement.webkitRequestFullscreen).call(d.documentElement)}else{(d.exitFullscreen||d.webkitExitFullscreen).call(d)}}

inp.addEventListener("input",preview);
document.addEventListener("keydown",e=>{
  if(mode==="set"){if(e.key==="Enter"){e.preventDefault();start()}return}
  if(e.key===" "){e.preventDefault();
    if(mode==="run"){left=endAt-Date.now();setMode("paused");draw(left)}
    else if(mode==="paused"){endAt=Date.now()+left;setMode("run");tick()}}
  else if(e.key==="ArrowUp"){e.preventDefault();nudge(1)}
  else if(e.key==="ArrowDown"){e.preventDefault();nudge(-1)}
  else if(e.key==="Escape"||e.key==="Enter"&&mode==="done"){wake(false);setMode("set")}
  else if(e.key==="f"||e.key==="F"){fs()}
});
document.addEventListener("dblclick",fs);
document.addEventListener("click",e=>{if(mode==="set"&&e.target!==inp)inp.focus()});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&mode==="run")wake(true)});
document.addEventListener("mousemove",()=>{body.classList.remove("idle");clearTimeout(idleT);idleT=setTimeout(()=>{if(mode!=="set")body.classList.add("idle")},1800)});
setMode("set");
})();
</script>
</body>
</html>
